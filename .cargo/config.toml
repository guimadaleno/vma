# The Windows shell is built from a Linux, WSL or macOS checkout with the
# mingw-w64 cross toolchain (`apt install gcc-mingw-w64-x86-64`, or
# `brew install mingw-w64`). On Windows with the MSVC toolchain installed, a
# plain `cargo build --release` works and ignores this.
[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
ar     = "x86_64-w64-mingw32-ar"

[alias]
# Shorthand for the cross build.
win = "build --release --target x86_64-pc-windows-gnu"
